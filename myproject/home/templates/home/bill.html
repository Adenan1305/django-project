{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful | Noodle Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'home/css/styles.css' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{% static 'home/js/receipt.js' %}" defer></script>
</head>
<body class="font-[Poppins] bg-gray-100 text-gray-800">
    <header class="sticky top-0 z-50"><nav class="flex items-center justify-between px-6 py-3 bg-white/90 backdrop-blur-lg shadow-md"><a class="flex items-center gap-2" href="{% url 'portfolio:index' %}"><span class="w-9 h-9 rounded-full overflow-hidden block"><img src="{% static 'home/img/logo-NS.png' %}" class="w-full h-full object-cover" alt="Noodle Shop logo"></span><span class="text-lg font-semibold">NOODLE SHOP</span></a><div class="flex gap-2 text-sm font-medium"><a href="{% url 'portfolio:index' %}" class="px-4 py-1.5 rounded-lg hover:bg-orange-500 hover:text-white">Home</a><a href="{% url 'portfolio:menu' %}" class="px-4 py-1.5 rounded-lg hover:bg-orange-500 hover:text-white">Menu</a></div></nav></header>
    <main class="min-h-[70vh] flex justify-center items-center px-6 py-12"><div class="max-w-2xl w-full text-center"><div class="w-20 h-20 mx-auto rounded-full bg-green-100 flex items-center justify-center text-4xl shadow-lg">✔</div><h1 class="text-4xl font-bold mt-6 text-gray-800">Order Successful!</h1><p class="text-gray-500 mt-2">Thank you for your order 🍜</p><p class="text-sm text-gray-400 mt-1">We are preparing your food...</p>
        <div id="receipt" class="bg-white rounded-3xl shadow-xl p-8 mt-10 text-left"><div class="flex justify-between items-center mb-6"><h2 class="text-xl font-bold">Receipt</h2><span class="text-sm text-gray-500">#<span id="order-id"></span></span></div><div id="receipt-items" class="space-y-2 mb-6"></div><div class="border-t pt-4 space-y-2 text-sm"><div class="flex justify-between"><span>Subtotal</span><span>$ <span id="subtotal"></span></span></div><div class="flex justify-between"><span>VAT (7%)</span><span>$ <span id="vat"></span></span></div><div class="flex justify-between font-bold text-lg"><span>Total</span><span>$ <span id="total"></span></span></div></div><div class="mt-6 flex justify-between text-sm"><span>Payment</span><span id="payment-method"></span></div><div class="flex gap-3 mt-8"><button onclick="window.print()" class="flex-1 bg-orange-600 text-white py-3 rounded-xl hover:opacity-80 transition">Print / Save</button><a href="{% url 'portfolio:menu' %}" class="flex-1 text-center border py-3 rounded-xl hover:bg-green-100 transition">Order Again</a></div></div>
    </div></main>
    <footer class="bg-gray-900 text-gray-300 text-center py-10"><p class="text-white font-semibold">🍜 NOODLE SHOP</p><p class="text-sm text-gray-400 mt-2">Fresh ingredients, bold flavors, and fast service.</p></footer>
</body>
</html>
